<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O Manifesto — Slide 6</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

          :root {
            --bg-dark: #0C0C0F;
            --text-cream: #F4EFE6;
            --text-muted: #9A958C;
            --accent-magenta: #FF0570;
          }

          .slide-container {
            min-height: 100vh;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 48px;
            font-family: 'Space Grotesk', sans-serif;
          }

          .accent-bar {
            width: 80px;
            height: 4px;
            background: var(--accent-magenta);
            margin-bottom: 48px;
          }

          .headline {
            font-size: 56px;
            font-weight: 700;
            color: var(--text-cream);
            text-align: center;
            max-width: 800px;
            line-height: 1.1;
            letter-spacing: -2px;
          }

          .headline .highlight {
            color: var(--accent-magenta);
          }

          .subtext {
            margin-top: 32px;
            font-size: 20px;
            color: var(--text-muted);
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
          }

          .cta-box {
            margin-top: 48px;
            padding: 32px 48px;
            background: var(--accent-magenta);
            border-radius: 12px;
            text-align: center;
          }

          .cta-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
          }

          .cta-text {
            font-size: 24px;
            color: white;
            font-weight: 700;
          }

          .cta-box:hover {
            transform: scale(1.02);
            transition: transform 0.2s ease;
          }

          .slide-number {
            position: absolute;
            bottom: 32px;
            right: 48px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
          }

          .brand {
            position: absolute;
            bottom: 32px;
            left: 48px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 2px;
          }
        </style>
      </helmet>

      <div class="slide-container" data-screen-label="Slide 6 - CTA">
        <div class="accent-bar"></div>
        <h1 class="headline">
          É hora de construir<span class="highlight"> produtos que funcionam</span>.
        </h1>
        <p class="subtext">
          Product Design não éDecoração.<br/>
          É estratégia, dados e método.
        </p>

        <div class="cta-box">
          <p class="cta-label">Próximo passo</p>
          <p class="cta-text">Vamos conversar →</p>
        </div>

        <span class="slide-number">6 / 6</span>
        <span class="brand">PWLABS</span>
      </div>
    </x-dc>

    <script
      type="text/x-dc"
      data-dc-script
    >
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
