<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>O Manifesto — Slide 5</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet data-dc-atomics>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');

          :root {
            --bg-dark: #0C0C0F;
            --text-cream: #F4EFE6;
            --text-muted: #9A958C;
            --accent-magenta: #FF0570;
          }

          .slide-container {
            min-height: 100vh;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 48px;
            font-family: 'Space Grotesk', sans-serif;
          }

          .section-label {
            font-size: 14px;
            color: var(--accent-magenta);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 24px;
          }

          .headline {
            font-size: 48px;
            font-weight: 700;
            color: var(--text-cream);
            text-align: center;
            max-width: 900px;
            line-height: 1.2;
            letter-spacing: -1px;
          }

          .solution-card {
            background: linear-gradient(135deg, rgba(255, 5, 112, 0.1) 0%, rgba(255, 5, 112, 0.02) 100%);
            border: 1px solid rgba(255, 5, 112, 0.3);
            border-radius: 16px;
            padding: 48px;
            margin-top: 40px;
            max-width: 700px;
            text-align: center;
          }

          .solution-icon {
            width: 64px;
            height: 64px;
            background: var(--accent-magenta);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 28px;
            font-weight: 700;
            color: white;
          }

          .solution-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-cream);
            margin-bottom: 16px;
          }

          .solution-text {
            font-size: 18px;
            color: var(--text-muted);
            line-height: 1.6;
          }

          .slide-number {
            position: absolute;
            bottom: 32px;
            right: 48px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
          }

          .brand {
            position: absolute;
            bottom: 32px;
            left: 48px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 2px;
          }
        </style>
      </helmet>

      <div class="slide-container" data-screen-label="Slide 5 - Solução 3">
        <span class="section-label">A Mudança</span>
        <h1 class="headline">Parar de assumir. Começar a <span style="color: var(--accent-magenta)">medir</span>.</h1>

        <div class="solution-card">
          <div class="solution-icon">03</div>
          <h3 class="solution-title">Métricas que importam</h3>
          <p class="solution-text">
            UX não é feeling. É resultado.<br/>
            Cada decisão justifica um dado.
          </p>
        </div>

        <span class="slide-number">5 / 6</span>
        <span class="brand">PWLABS</span>
      </div>
    </x-dc>

    <script
      type="text/x-dc"
      data-dc-script
    >
      class Component extends DCLogic {
        renderVals() { return {}; }
      }
    </script>
  </body>
</html>
